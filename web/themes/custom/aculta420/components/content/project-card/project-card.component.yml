$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Project card
status: experimental
group: Cards
description: 'Project card inner markup with optional media and renderable slots. Project data comes from the node; the Drupal presenter owns the article.'
props:
  type: object
  properties: {}
slots:
  media:
    title: Media
    description: 'Optional project image, already rendered. Omitted when empty.'
  category:
    title: Category
  title:
    title: Title
    description: 'Linked project title, built by the presenter.'
  summary:
    title: Summary
  cta:
    title: Call to action
    description: 'Project link label, built by the presenter.'
