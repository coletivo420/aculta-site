$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Rail
status: experimental
group: Patterns
description: 'Horizontal rail of items with native scrolling and snap points. No JavaScript: keyboard scrolling and focus come from the browser. Shares the carousel focus and token language.'
props:
  type: object
  properties:
    label:
      type: string
      description: 'Accessible name of the scrollable region.'
      default: ''
slots:
  items:
    title: Items
    description: 'Rendered items, each one wrapped by the caller.'
assets:
  css:
    component:
      rail.css: {}
